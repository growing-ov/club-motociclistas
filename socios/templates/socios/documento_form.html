{% extends "socios/base.html" %}

{% block content %}
<h1>{% if object %}Editar{% else %}Nuevo{% endif %} documento</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'documento_list' %}">Cancelar</a>
</form>
{% endblock %}
