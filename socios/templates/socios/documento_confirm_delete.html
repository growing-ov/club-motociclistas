{% extends "socios/base.html" %}

{% block content %}
<h1>Eliminar documento</h1>
<p>Estas seguro de eliminar <b>{{ object }}</b>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Si, eliminar</button>
    <a href="{% url 'documento_list' %}">Cancelar</a>
</form>
{% endblock %}
