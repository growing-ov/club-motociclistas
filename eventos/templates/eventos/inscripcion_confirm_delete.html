{% extends "base.html" %}

{% block title %}Eliminar inscripcion{% endblock %}

{% block content %}
<div class="encabezado">
    <h2>Eliminar inscripcion</h2>
</div>

<div class="tarjeta">
    <p>Estas seguro de eliminar esta inscripcion?</p>
    <form method="post">
        {% csrf_token %}
        <button class="boton boton-peligro" type="submit">Si, eliminar</button>
        <a class="boton" href="{% url 'inscripcion_list' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
