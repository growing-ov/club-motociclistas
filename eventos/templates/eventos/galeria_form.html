{% extends "base.html" %}

{% block title %}{% if object %}Editar{% else %}Nueva{% endif %} foto{% endblock %}

{% block content %}
<div class="encabezado">
    <h2>{% if object %}Editar{% else %}Nueva{% endif %} foto</h2>
</div>

<form method="post" class="tarjeta">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="boton boton-primario" type="submit">Guardar</button>
    <a class="boton" href="{% url 'galeria_list' %}">Cancelar</a>
</form>
{% endblock %}
