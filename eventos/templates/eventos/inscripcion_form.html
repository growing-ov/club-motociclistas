{% extends "eventos/base.html" %}

{% block content %}
<h1>{% if object %}Editar{% else %}Nueva{% endif %} inscripcion</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'inscripcion_list' %}">Cancelar</a>
</form>
{% endblock %}
