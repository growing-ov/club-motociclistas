{% extends "base.html" %}

{% block title %}Eliminar foto{% endblock %}

{% block content %}
<div class="encabezado">
    <h2>Eliminar foto</h2>
</div>

<div class="tarjeta">
    <p>Estas seguro de eliminar <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="boton boton-peligro" type="submit">Si, eliminar</button>
        <a class="boton" href="{% url 'galeria_list' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
