# ---------------------------------------------------------------------------
# Entorno de desarrollo con Docker Compose.
# Uso:  copy .env.example .env   (define MONGO_URI con tu URI de Atlas)
#       docker compose up --build
#
# La base de datos es MongoDB Atlas (servicio externo): MONGO_URI es
# obligatorio y sale de .env. Si no esta definido, Compose aborta con un
# mensaje explicito en lugar de arrancar contra una base vacia.
#
# El servicio "mongo" es opcional (perfil "mongo-local") y solo se usa si
# quieres un MongoDB efimero para pruebas:
#   docker compose --profile mongo-local up --build
#   MONGO_URI=mongodb://mongo:27017
# ---------------------------------------------------------------------------
name: club-motociclistas

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: club-motociclistas:dev
    container_name: club-motociclistas-web
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-8000}:8000"
    env_file:
      # Opcional: si existe, aporta SECRET_KEY, DEBUG, ALLOWED_HOSTS, etc.
      - path: .env
        required: false
    environment:
      # Conexion a MongoDB Atlas. Obligatoria: define MONGO_URI en .env.
      MONGO_URI: ${MONGO_URI:?define MONGO_URI (MongoDB Atlas) en el archivo .env}
      MONGO_DB: ${MONGO_DB:-club_motociclistas}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-cambia-esta-clave-en-produccion}
      DJANGO_SETTINGS_MODULE: club_motociclistas.settings
      ESPERA_MONGO: ${ESPERA_MONGO:-60}
    volumes:
      # Persistencia de archivos subidos. OJO: settings.py no define
      # MEDIA_ROOT, hay que anadir MEDIA_ROOT="/app/media" para usar esto.
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/esquemas/', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # MongoDB local opcional, solo para pruebas. No se levanta por defecto.
  mongo:
    image: mongo:7
    container_name: club-motociclistas-mongo
    profiles: ["mongo-local"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
  media_data:
