{% extends "base.html" %}

{% block title %}Eliminar accidente{% endblock %}

{% block content %}
<div class="encabezado">
    <h2>Eliminar accidente</h2>
</div>

<div class="tarjeta">
    <p>Estas seguro de eliminar este accidente del {{ object.fecha|date:"d/m/Y" }}?</p>
    <form method="post">
        {% csrf_token %}
        <button class="boton boton-peligro" type="submit">Si, eliminar</button>
        <a class="boton" href="{% url 'accidente_list' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
